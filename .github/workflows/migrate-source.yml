name: One-shot source migration

on:
  push:
    paths:
      - '.github/workflows/migrate-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact subject sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jaredwilder/unpublished-math-papers.git /tmp/papers
          git clone --depth 1 https://github.com/jaredwilder/erdos-theorems.git /tmp/theorems
          mkdir -p theorem-bank rank-three-kernel formal-mirrors
          cp -R /tmp/papers/fiber-coherence-theorem-bank/. theorem-bank/
          cp -R /tmp/papers/rank-three-kernel/. rank-three-kernel/
          shopt -s nullglob
          for d in /tmp/theorems/erdos595-*; do
            cp -R "$d" formal-mirrors/
          done
          rm .github/workflows/migrate-source.yml
          git config user.name "Jared Wilder release migration"
          git config user.email "jared@jaredwilder.com"
          git add -A
          git commit -m "Migrate exact fiber-coherence and rank-three sources"
          git push
